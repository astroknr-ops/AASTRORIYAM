<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AASTRORIYAM — ആർട്ട് ആങ്കർ ടൂൾ</title>
<style>
:root{--bg:#050811;--panel:#0b1224;--border:rgba(148,163,184,.25);--accent:#38bdf8;--gold:#fbbf24;--text:#f1f5f9;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.6 system-ui,"Noto Sans Malayalam",sans-serif;padding:12px}
h1{font-size:16px;color:var(--accent);margin-bottom:6px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
select,input,button,textarea{background:#1e293b;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px}
input[type=url]{flex:1;min-width:180px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
#hint{color:var(--gold);min-height:20px}
.panes{display:flex;gap:10px;flex-wrap:wrap}
canvas{width:100%;max-width:420px;background:#0b152b;border:1px solid var(--border);border-radius:10px;touch-action:manipulation}
textarea{width:100%;height:70px;margin-top:6px;font-family:monospace}
.note{color:var(--muted);font-size:11px;margin-top:6px}
</style>
</head>
<body>
<h1>ആർട്ട് ആങ്കർ ടൂൾ</h1>
<div class="bar">
  <select id="sel"></select>
  <input type="file" id="file" accept="image/*">
  <input type="url" id="url" placeholder="അല്ലെങ്കിൽ ചിത്രത്തിന്റെ URL">
  <button id="load">ലോഡ്</button>
</div>
<div id="hint"></div>
<div class="panes"><canvas id="ci" width="360" height="360"></canvas><canvas id="cc" width="360" height="360"></canvas></div>
<div class="bar">
  <button id="undo">അവസാനത്തെ ജോടി മായ്ക്കുക</button><button id="reset">റീസെറ്റ്</button>
  <label>പ്രിവ്യൂ തെളിച്ചം <input type="range" id="alpha" min="0.1" max="1" step="0.05" value="0.5"></label>
</div>
<textarea id="out" readonly placeholder="Art_Anchors ഇവിടെ വരും"></textarea>
<div class="bar"><button id="copy">Art_Anchors കോപ്പി ചെയ്യുക</button></div>
<div class="note">ഷീറ്റിൽ ആ കോൺസ്റ്റലേഷന്റെ വരിയിൽ Art_URL-ൽ ചിത്രത്തിന്റെ നേരിട്ടുള്ള ലിങ്കും, പുതിയ കോളം K (Art_Anchors)-ൽ കോപ്പി ചെയ്തതും പേസ്റ്റ് ചെയ്യുക. ചിത്രം പ്രിവ്യൂവിന് മാത്രമാണ് ഇവിടെ എടുക്കുന്നത്, അപ്ലോഡ് ചെയ്യുന്നില്ല.</div>

function affine(s,d){
  if(s.length===2){
    const [a,b]=s,[c,e]=d;
    s=[a,b,[a[0]-(b[1]-a[1]),a[1]+(b[0]-a[0])]];
    d=[c,e,[c[0]-(e[1]-c[1]),c[1]+(e[0]-c[0])]];
  }
  const [x0,y0]=s[0],[x1,y1]=s[1],[x2,y2]=s[2];
  const det=(x1-x0)*(y2-y0)-(x2-x0)*(y1-y0); if(Math.abs(det)<1e-9) return null;
  const f=i=>{ const v0=d[0][i],v1=d[1][i],v2=d[2][i];

}
function setCon(k){
  abbr=k; pairs=[]; pending=null;
  const seen=new Map(); CON[k].l.forEach(pl=>pl.forEach(q=>seen.set(q[0]+","+q[1],q)));
  const pts=[...seen.values()], r0=pts[0][0];
  const mra=r0+pts.reduce((a,q)=>a+dra(q[0],r0),0)/pts.length, mdec=pts.reduce((a,q)=>a+q[1],0)/pts.length;
  const k0=Math.cos(mdec*Math.PI/180)*15;

  const P=pts.map(xy), xs=P.map(p=>p[0]), ys=P.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sc=Math.min((cc.width-70)/((x1-x0)||1),(cc.height-70)/((y1-y0)||1));

function render(){

ci.onclick=e=>{

  const [x,y]=pt(ci,e), f=fitI(), u=(x-f.ox)/(img.naturalWidth*f.s), v=(y-f.oy)/(img.naturalHeight*f.s);

  verts.forEach(v=>{const d=Math.hypot(v.sx-x,v.sy-y); if(d<bd){bd=d;b=v}});

$("copy").onclick=()=>{ const o=$("out"); if(!o.value) return; o.select(); (navigator.clipboard?navigator.clipboard.writeText(o.value):Promise.reject()).catch(()=>document.execCommand("copy")); };

Object.keys(CON).sort((a,b)=>CON[a].en.localeCompare(CON[b].en)).forEach(k=>sel.add(new Option(`${CON[k].en} (${k})`,k)));
sel.onchange=()=>{ setCon(sel.value); render(); };
setCon(sel.value); render();
</script>
