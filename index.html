<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700&display=swap">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="AASTRORIUM">
<meta name="theme-color" content="#050811">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>ആസ്ട്രോറിയം (AASTRORIUM) — ആസ്ട്രോകേരളയുടെ നക്ഷത്ര നിരീക്ഷണ സഹായി</title>
<style>
:root{--bg:#050811;--panel:rgba(11,18,36,.92);--border:rgba(148,163,184,.22);--accent:#38bdf8;--accent2:#fbbf24;--text:#f1f5f9;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans Malayalam",system-ui,-apple-system,sans-serif;overflow:hidden;height:100dvh;width:100vw;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
canvas#sky{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.topbar{position:fixed;top:10px;left:10px;right:10px;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand,.csv-bar,.toolbar,.drawer,.info-card{background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(10px)}
.brand{padding:8px 14px;border-radius:12px}
.brand h1{font-size:16px;color:var(--accent)}
.brand small{font-size:11px;color:var(--muted);display:block}
.csv-bar{display:flex;gap:6px;padding:6px 10px;border-radius:12px;flex:1;max-width:520px}
.csv-bar input,.drawer input.search{flex:1;width:100%;background:rgba(2,6,23,.85);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;font-size:12px;outline:none}
.csv-bar input:focus,.drawer input.search:focus{border-color:var(--accent)}
button{background:rgba(30,41,59,.9);color:var(--text);border:1px solid var(--border);padding:7px 11px;border-radius:8px;font-size:12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.active{background:rgba(56,189,248,.22);border-color:var(--accent);color:var(--accent);font-weight:600}
button.gold.active{background:rgba(251,191,36,.2);border-color:var(--accent2);color:var(--accent2)}
.drawer{position:fixed;top:66px;right:10px;bottom:64px;width:310px;max-width:calc(100vw - 20px);border-radius:14px;z-index:25;display:flex;flex-direction:column;overflow:hidden;transition:transform .22s ease}
.drawer.hidden{transform:translateX(115%);pointer-events:none}
.drawer-head{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.drawer-title{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--accent2)}
.drawer-actions{display:flex;gap:5px;flex-wrap:wrap}
.drawer-actions button{padding:4px 8px;font-size:11px}
.checklist{flex:1;overflow-y:auto;padding:6px 10px}
.chk-item{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;font-size:12px;border-bottom:1px solid rgba(148,163,184,.08)}
.chk-item input{width:16px;height:16px;accent-color:var(--accent)}
.chk-label{flex:1;cursor:pointer}
.chk-label span{color:var(--muted);font-size:11px;display:block}
.tag{font-size:10px;padding:2px 6px;border-radius:999px;background:rgba(251,191,36,.15);color:var(--accent2)}
.info-card{position:fixed;left:10px;bottom:64px;max-width:360px;border-radius:14px;padding:12px 14px;z-index:22;font-size:12px;line-height:1.5;display:none}
.info-card.show{display:block}
.info-card h3{font-size:15px;color:var(--accent)}
.info-row{margin-top:4px;color:#cbd5e1}.info-row b{color:var(--accent2)}
.toolbar{position:fixed;bottom:10px;left:10px;right:10px;z-index:20;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:8px 10px;border-radius:14px}
.pan{position:fixed;left:10px;top:66px;width:300px;max-width:calc(100vw - 20px);max-height:calc(100dvh - 140px);overflow-y:auto;background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(10px);border-radius:14px;padding:12px 14px;z-index:24;font-size:12px;line-height:1.6;display:none}
.pan.show{display:block}
.pan h3{font-size:14px;color:var(--accent2);margin-bottom:4px}
.pan table{width:100%;border-collapse:collapse;margin:6px 0}
.pan td{padding:2px 4px;border-bottom:1px solid rgba(148,163,184,.1)}
.pan td:first-child{color:var(--accent)}
.toolbar{bottom:66px}
.toolbar.hide{display:none}
.csv-bar.hide{display:none}
.fab{position:fixed;right:12px;bottom:12px;z-index:30;width:46px;height:46px;border-radius:50%;font-size:20px;padding:0;background:rgba(11,18,36,.95)}
.pan,.drawer{top:92px}
.more{margin-top:4px;padding:3px 8px;font-size:11px;color:var(--accent2);border-color:rgba(251,191,36,.4)}
.infopanel{position:fixed;left:10px;top:108px;width:330px;max-width:calc(100vw - 20px);height:min(520px,calc(100dvh - 200px));z-index:26;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--panel);backdrop-filter:blur(10px)}
.infopanel.hide{display:none}
.infopanel iframe{width:100%;height:100%;border:0;background:transparent}
.toolbar{z-index:28}
.pan label{display:block;margin:7px 0;color:var(--text)}
.pan input[type=range]{width:100%}
.pan input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
html.night{filter:sepia(1) saturate(4) hue-rotate(-40deg) brightness(.8)}
.toolbar{left:8px;right:auto;bottom:auto;top:96px;width:50px;max-height:calc(100dvh - 190px);overflow-y:auto;flex-direction:column;flex-wrap:nowrap;align-items:center;gap:5px;padding:6px}
.toolbar button{width:36px;height:36px;padding:0;font-size:17px;line-height:1;border-radius:12px;flex:none}
.brand{padding:5px 10px}.brand h1{font-size:13px}.brand small{font-size:10px}
.pan{left:68px;width:min(300px,calc(100vw - 80px))}
.infopanel{left:68px;width:min(330px,calc(100vw - 80px))}
.drawer{top:118px}
#hud{position:fixed;top:10px;right:10px;z-index:15;padding:6px 9px;border-radius:10px;background:var(--panel);border:1px solid var(--border);font:10.5px/1.5 system-ui;color:#cbd5e1;pointer-events:none;text-align:right;display:none}
#hud b{color:var(--accent2);font-weight:600}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:40;padding:6px 12px;border-radius:999px;background:rgba(11,18,36,.95);border:1px solid var(--border);font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.footer{position:fixed;left:10px;right:70px;bottom:10px;z-index:20;padding:6px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(10px)}
.footer .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.footer h1{font-size:13px;color:var(--accent)}
.footer small{font-size:10px;color:var(--muted)}
.footer .more{margin:0;padding:2px 8px}
.footer .copy{margin-top:2px;font-size:10px;line-height:1.4;color:var(--muted)}
.infopanel{top:auto;bottom:calc(var(--fh,76px) + 18px);height:min(520px,calc(100dvh - var(--fh,76px) - 160px))}
#toast{bottom:calc(var(--fh,76px) + 18px)}
.toolbar{max-height:calc(100dvh - var(--fh,76px) - 120px)}
.footer #hud{position:static;display:none;margin-bottom:4px;padding:0 0 4px;border:0;border-bottom:1px solid var(--border);border-radius:0;background:none;text-align:left;font-size:10.5px}
.footer #hud div{display:inline-block;margin-right:10px}
button,input,select,textarea{font-family:inherit}
.footer .tag{font-size:11px;color:var(--text);margin-top:1px}
.info-card{left:66px;max-width:min(360px,calc(100vw - 80px));max-height:48vh;overflow-y:auto}
.xclose{position:absolute;top:6px;right:8px;padding:2px 9px;font-size:12px;z-index:3}
.pan table.cal{font-size:11px}.pan table.cal td{padding:3px 3px;vertical-align:top}
.pan tr.today{background:rgba(56,189,248,.18)}.pan tr.sp td{color:#fbbf24}
.pan .sec{margin-top:8px;color:var(--accent2);font-weight:700}
#qbar{display:flex;align-items:center;gap:4px}
#qbar button{margin:0;padding:0;width:30px;height:28px;font-size:14px;border-radius:9px;line-height:1}
#clk{display:flex;align-items:center;gap:2px;height:28px;padding:0 3px 0 8px;font-size:11px;white-space:nowrap;border:1px solid var(--border);border-radius:9px;background:rgba(2,6,23,.6);cursor:pointer}
#clk.shift{color:#fbbf24;border-color:#fbbf24}
#qbar #clkGear{width:22px;height:22px;border:0;background:none;font-size:13px}
#searchBtn,#timeBtn,#tonightBtn,#compassBtn{display:none}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="topbar">
  <div class="csv-bar hide" id="csvBar">
    <input id="csvInput" type="url" placeholder="Google Sheet Published CSV URL ഇവിടെ പേസ്റ്റ് ചെയ്യുക...">
    <button id="loadCsvBtn" class="active">Load Sheet</button>
  </div>
</div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-title"><span>88 കോൺസ്റ്റലേഷൻ ചെക്ക് ലിസ്റ്റ്</span><span><span id="selectedCount">0 / 88</span> <button id="drawerClose" style="padding:2px 7px;font-size:11px">✕</button></span></div>

    </div>

  </div>
  <div class="checklist" id="checklist"></div>
</aside>
<div class="info-card" id="infoCard">
  <div style="display:flex;justify-content:space-between;align-items:center"><h3 id="infoTitle"></h3><button id="closeInfoBtn" style="padding:2px 7px;font-size:11px">✕</button></div>
  <div class="info-row" id="infoSub"></div><div class="info-row" id="infoNak"></div>

</div>

<div id="toast"></div>
<div class="footer" id="footer">

  <button id="moreBtn" class="more">കൂടുതൽ വിവരങ്ങൾ ▴</button></div>
  <div id="ftExtra"><div class="tag">ആസ്ട്രോകേരളയുടെ നക്ഷത്ര നിരീക്ഷണ സഹായി</div>
  <div class="copy">© 2026 ആസ്ട്രോ കണ്ണൂർ &nbsp;•&nbsp; പകർപ്പവകാശം സംരക്ഷിതം<br>ആസ്ട്രോ കണ്ണൂരിനു വേണ്ടി നിർമ്മിച്ചത് &nbsp;•&nbsp; നിർമ്മാണം: പ്രഭാകരൻ കോവൂർ</div></div>
</div>
<button class="fab" id="menuBtn">☰</button>
<div class="toolbar" id="toolbar">
  <button id="toggleLinesBtn" class="active">രാശി വരകൾ</button>
  <button id="toggleArtBtn" class="gold active">ചിത്രം</button>
  <button id="toggleLabelsBtn" class="active">പേരുകൾ</button>
  <button id="toggleBodiesBtn" class="gold active">ചന്ദ്രൻ / ഗ്രഹങ്ങൾ</button>
  <button id="toggleNakBtn" class="gold active">27 നക്ഷത്രം</button>

  <button id="resetViewBtn">സെന്റർ</button>

  <button id="toggleSetBtn">ക്രമീകരണം</button>

  <button id="toggleDrawerBtn" class="active">ചെക്ക് ലിസ്റ്റ്</button>
</div>

function getLST(ms=Date.now()){

// az/alt (radians) -> സ്ക്രീൻ
function proj(az, alt){
  const x=Math.cos(alt)*Math.sin(az), y=Math.cos(alt)*Math.cos(az), z=Math.sin(alt);
  const x1=x*cY-y*sY, y1=x*sY+y*cY;
  const y2=y1*cP+z*sP, z2=z*cP-y1*sP;   // പിച്ച് ഫിക്സ്
  if(y2<=0.05) return null;
  return {x:W/2+x1/y2*S, y:H/2-z2/y2*S};
}
function horiz(ra,dec,lst){
  sinLat=Math.sin(lat*D); cosLat=Math.cos(lat*D);
  const ha=(lst-ra)*15*D, d=dec*D;
  const sa=Math.sin(d)*sinLat+Math.cos(d)*cosLat*Math.cos(ha);
  const alt=Math.asin(Math.max(-1,Math.min(1,sa)));
  const ca=Math.cos(alt)*cosLat||1e-6;
  let az=Math.acos(Math.max(-1,Math.min(1,(Math.sin(d)-Math.sin(alt)*sinLat)/ca)));
  if(Math.sin(ha)>0) az=2*Math.PI-az;
  return [az,alt];
}
function toScr(ra,dec,lst,minAlt=-3){
  [ra,dec]=precess(ra,dec);
  const [az,alt]=horiz(ra,dec,lst);
  return alt/D<minAlt?null:proj(az,alt);
}

let PM=null,PMk=-1;
function precess(ra,dec){
  const k=Math.floor(Date.now()/60000);
  if(k!==PMk){ PMk=k;
    const T=(Date.now()/86400000+2440587.5-2451545)/36525, A=3600/D;
    const z1=(2306.2181*T+0.30188*T*T+0.017998*T**3)/A, z2=(2306.2181*T+1.09468*T*T+0.018203*T**3)/A, th=(2004.3109*T-0.42665*T*T-0.041833*T**3)/A;
    const c1=Math.cos(z1),s1=Math.sin(z1),c2=Math.cos(z2),s2=Math.sin(z2),ct=Math.cos(th),st=Math.sin(th);
    PM=[c1*c2*ct-s1*s2,-s1*c2*ct-c1*s2,-c2*st,c1*s2*ct+s1*c2,-s1*s2*ct+c1*c2,-s2*st,c1*st,-s1*st,ct];
  }
  const a=ra*15*D,d=dec*D,cd=Math.cos(d),x=cd*Math.cos(a),y=cd*Math.sin(a),z=Math.sin(d);
  return [Math.atan2(PM[3]*x+PM[4]*y+PM[5]*z, PM[0]*x+PM[1]*y+PM[2]*z)/D/15, Math.asin(PM[6]*x+PM[7]*y+PM[8]*z)/D];
}
function moonRot(b,lst){
  const s=bodies.find(o=>o.key==="sun"), a=(s.ra-b.ra)*15*D, d0=b.dec*D, d1=s.dec*D;
  const chi=Math.atan2(Math.cos(d1)*Math.sin(a), Math.sin(d1)*Math.cos(d0)-Math.cos(d1)*Math.sin(d0)*Math.cos(a));
  const sc=(ra,dec)=>{const [az,alt]=horiz(ra,dec,lst);return proj(az,alt)};
  const p1=sc(b.ra,b.dec), p2=sc(b.ra+2*Math.sin(chi)/Math.cos(d0)/15, b.dec+2*Math.cos(chi));
  return p1&&p2?Math.atan2(p2.y-p1.y,p2.x-p1.x):0;
}

function riseSet(dayStart){
  const key=dayStart+"|"+lat.toFixed(2)+"|"+lon.toFixed(2);
  if(rsCache&&rsCache.key===key) return rsCache.res;
  const res={}; RS_BODIES.forEach(k=>res[k]={rise:null,set:null});
  const val=(t,k)=>altMinusH0(ephem(t).find(o=>o.key===k),getLST(t));

  const step=600000; let prev=null;
  for(let i=0;i<=144;i++){
    const t=dayStart+i*step, E=ephem(t), lst=getLST(t);
    const cur=RS_BODIES.map(k=>altMinusH0(E.find(o=>o.key===k),lst));

const EPSD=23.4393, GN=["സൂ","ച","കു","ബു","ഗു","ശു","ശ","രാ","കേ"], GK=["sun","moon","mars","mercury","jupiter","venus","saturn","rahu","ketu"];

function grahaData(){
  const now=Date.now(), E=ephem(now), ay=E.find(o=>o.key==="moon").ayan, rs=riseSet(dayStartMs());
  const th=getLST(now)*15*D, e=EPSD*D, asc=rev(Math.atan2(Math.cos(th),-(Math.sin(th)*Math.cos(e)+Math.tan(lat*D)*Math.sin(e)))/D);
  const altAt=(k,t)=>{ const b=ephem(t).find(o=>o.key===k), al=horiz(b.ra,b.dec,getLST(t))[1]; return (al-(b.par?b.par*Math.cos(al):0))/D; };
  const vis=k=>{ if(k==="sun"||k==="rahu"||k==="ketu"||!rs.sun.rise||!rs.sun.set) return "";
    const ev=altAt(k,rs.sun.set+36e5)>8, mo=altAt(k,rs.sun.rise-36e5)>8;
    return ev&&mo?"രാത്രി മുഴുവൻ":ev?"സന്ധ്യയ്ക്ക് കാണാം":mo?"പ്രഭാതത്തിൽ കാണാം":"കാണാനാവില്ല"; };
  const items=GK.map((k,i)=>{ const b=E.find(o=>o.key===k), sd=rev((b.ring?b.lon:eclLon(b))-ay), r=rs[k]||{};
    return {n:GN[i],name:b.ml,r:Math.floor(sd/30),d:sd%30,rise:fmt(r.rise),set:fmt(r.set),vis:vis(k)}; });
  const sa=rev(asc-ay);

}

function orbit(k,d){

          z:r*Math.sin(vw)*Math.sin(ir),r,M,w,N};

// ---- ആർട്ട് ചിത്രം: 2-3 ആങ്കർ നക്ഷത്രങ്ങൾ [u,v,RA,Dec] (u,v = ചിത്രത്തിൽ 0..1) ----
function affine(s,d){
  if(s.length===2){   // 2 ആങ്കർ: സിമിലാരിറ്റി (റൊട്ടേഷൻ + ഒരേ സ്കെയിൽ)
    const [a,b]=s,[c,e]=d;
    s=[a,b,[a[0]-(b[1]-a[1]),a[1]+(b[0]-a[0])]];
    d=[c,e,[c[0]-(e[1]-c[1]),c[1]+(e[0]-c[0])]];
  }
  const [x0,y0]=s[0],[x1,y1]=s[1],[x2,y2]=s[2];
  const det=(x1-x0)*(y2-y0)-(x2-x0)*(y1-y0); if(Math.abs(det)<1e-9) return null;
  const f=i=>{ const v0=d[0][i],v1=d[1][i],v2=d[2][i];
    const p=((v1-v0)*(y2-y0)-(v2-v0)*(y1-y0))/det, q=((v2-v0)*(x1-x0)-(v1-v0)*(x2-x0))/det;
    return [p,q,v0-p*x0-q*y0]; };
  const X=f(0),Y=f(1);
  return [X[0],Y[0],X[1],Y[1],X[2],Y[2]];
}
// ലീസ്റ്റ്-സ്ക്വയർ സിമിലാരിറ്റി (uniform scale + rotation, shear ഇല്ല) — എല്ലാ ആങ്കറുകളും ഉപയോഗിക്കുന്നു
function similarity(s,d){
  const n=s.length; let sx=0,sy=0,dx=0,dy=0;
  for(let i=0;i<n;i++){ sx+=s[i][0]; sy+=s[i][1]; dx+=d[i][0]; dy+=d[i][1]; }
  sx/=n; sy/=n; dx/=n; dy/=n;
  let num_r=0,num_i=0,den=0;
  for(let i=0;i<n;i++){
    const ax=s[i][0]-sx, ay=s[i][1]-sy, bx=d[i][0]-dx, by=d[i][1]-dy;
    num_r+=ax*bx+ay*by; num_i+=ax*by-ay*bx; den+=ax*ax+ay*ay;
  }
  if(den<1e-9) return null;
  const re=num_r/den, im=num_i/den;
  return [re, im, -im, re, dx-(re*sx-im*sy), dy-(im*sx+re*sy)];
}
function drawArt(c,lst){
  const im=c.img; if(!im||!im.naturalWidth) return;
  const iw=im.naturalWidth, ih=im.naturalHeight, an=c.anchors; let T=null;
  if(an&&an.length>=2){
    const src=[],dst=[];
    for(const a of an.slice(0,3)){ const p=toScr(a[2],a[3],lst,-90); if(!p) return; src.push([a[0]*iw,a[1]*ih]); dst.push([p.x,p.y]); }
    T=similarity(src,dst);   // ഒരേ സ്കെയിൽ + റൊട്ടേഷൻ മാത്രം: ചിത്രം വലിഞ്ഞ് വികൃതമാകില്ല
  }
  ctx.save(); ctx.globalCompositeOperation=im._screen?"screen":"source-over"; ctx.globalAlpha=SET.artA;
  if(T){ ctx.transform(...T); ctx.drawImage(im,0,0); }
  else{   // ആങ്കർ ഇല്ലെങ്കിൽ: കോൺസ്റ്റലേഷന്റെ വരകൾക്ക് ചുറ്റും ഏകദേശം ഫിറ്റ്
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const poly of c.lines) for(const q of poly){ const p=toScr(q[0],q[1],lst,-90); if(p){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y)} }
    if(x0<=x1){ const z=Math.max(x1-x0,y1-y0)*1.15; ctx.drawImage(im,(x0+x1)/2-z/2,(y0+y1)/2-z/2,z,z); }
  }
  ctx.restore();
}
function drawExtras(lst){

function draw(){
  setView();
  const lst=getLST(); skyF=calcSkyF(lst); FOCUS=pickFocus(lst);
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H/2,40,W/2,H/2,Math.max(W,H)*.75);
  g.addColorStop(0,mixc("#0b152b","#6f93c8",skyF)); g.addColorStop(1,mixc("#040711","#2f5d9e",skyF));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  for(const s of STARS){ if(s[2]>SET.mag) continue;
    const p=toScr(s[0],s[1],lst); if(!p) continue;
    ctx.fillStyle = s[3]<.3?"#cfe0ff":s[3]<.9?"#fff7ea":"#ffd2a1";
    ctx.globalAlpha = Math.min(1,1.15-s[2]*.15)*(1-.9*skyF);
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(.5,(2.9-s[2]*.45)*SET.ssize),0,6.283); ctx.fill(); starLabel(s,p);
  }
  ctx.globalAlpha=1;

  drawGuides(lst); ctx.strokeStyle="rgba(148,163,184,.35)"; ctx.lineWidth=1; ctx.beginPath();
  let pen=false;
  for(let a=0;a<=360;a+=4){
    const p=proj(a*D,0);
    if(!p){pen=false;continue}
    pen?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); pen=true;
  }
  ctx.stroke();

  for(const c of cons){
    c.sx=null;
    if(!c.checked) continue;
    const col="56,189,248";
    const cs=toScr(c.ra,c.dec,lst,-15);
    if(cs){c.sx=cs.x;c.sy=cs.y}
    if(showArt&&c.img&&(SET.artAll||c===FOCUS)) drawArt(c,lst);
    if(showLines){
      ctx.strokeStyle=`rgba(${col},.7)`; ctx.lineWidth=1.4;
      for(const poly of c.lines){
        ctx.beginPath(); let on=false;
        for(const q of poly){
          const p=toScr(q[0],q[1],lst,-5);
          if(!p){on=false;continue}
          on?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); on=true;
        }
        ctx.stroke();
      }
    }
    if(showLabels&&cs){
      ctx.fillStyle=c.zodiac?"#fde68a":"#bae6fd";
      ctx.font="600 12px 'Noto Sans Malayalam',system-ui,sans-serif";
      ctx.font=`600 ${SET.lab}px 'Noto Sans Malayalam',system-ui,sans-serif`; ctx.textAlign="center"; ctx.fillText(c.label,cs.x,cs.y-10);
    }
  }

  drawIndian(lst); drawDSO(lst); drawGround(lst); drawExtras(lst); drawHUD(lst);
  ctx.font="bold 12px 'Noto Sans Malayalam',system-ui,sans-serif"; ctx.textAlign="center";
  ctx.fillStyle="rgba(56,189,248,.9)";
  [["വടക്ക് (N)",0],["കിഴക്ക് (E)",90],["തെക്ക് (S)",180],["പടിഞ്ഞാറ് (W)",270]].forEach(([t,a])=>{
    const p=proj(a*D,2*D); if(p) ctx.fillText(t,p.x,p.y);
  });
}

const pts=new Map();
let lastPinch=0,dragging=false,lastX=0,lastY=0,downX=0,downY=0,moved=0;
const pinchDist=()=>{const [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
canvas.addEventListener("pointerdown",e=>{
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  dragging=pts.size===1; lastX=downX=e.clientX; lastY=downY=e.clientY; moved=0;
  if(pts.size===2) lastPinch=pinchDist();
});
window.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved=Math.max(moved,Math.hypot(e.clientX-downX,e.clientY-downY));
  if(pts.size===2){
    const d=pinchDist(); fov=Math.max(6,Math.min(110,fov*lastPinch/d)); lastPinch=d; needs=true; return;
  }
  if(!dragging||compassOn) return;
  yaw=((yaw-(e.clientX-lastX)*.22*fov/75)%360+360)%360;
  pitch=Math.max(-10,Math.min(88,pitch+(e.clientY-lastY)*.22*fov/75));
  lastX=e.clientX; lastY=e.clientY; needs=true;
});
function endPtr(e){
  if(e.type==="pointerup"&&pts.size===1&&moved<6) tap(e.clientX,e.clientY);
  pts.delete(e.pointerId); dragging=false;
}
window.addEventListener("pointerup",endPtr);
window.addEventListener("pointercancel",endPtr);
canvas.addEventListener("wheel",e=>{e.preventDefault();fov=Math.max(6,Math.min(110,fov+e.deltaY*.03*fov/75));needs=true},{passive:false});
function tap(x,y){
  let best=null,bd=45,fn=null;
  const chk=(o,f,pen=0)=>{ if(o.sx==null) return; const d=Math.hypot(o.sx-x,o.sy-y)+pen; if(d<bd){bd=d;best=o;fn=f} };
  cons.forEach(c=>chk(c,showInfo,12));
  if(showNak) NAK.forEach(n=>chk(n,showNakInfo));
  if(showBodies) bodies.forEach(b=>chk(b,showBody));
  if(MESS&&SET.mess!==false) MESS.forEach(o=>chk(o,showMessier));
  if(best) fn(best);
}

const orientEvt = "ondeviceorientationabsolute" in window ? "deviceorientationabsolute" : "deviceorientation";
let compassWanted=false;
function handleOrientation(e){
  if(e.alpha==null||e.beta==null||e.gamma==null) return;
  if(!compassOn){ compassOn=true; $("compassBtn").classList.add("active"); }   // സെൻസർ ഉള്ളപ്പോൾ മാത്രം
  const alpha = e.webkitCompassHeading!=null ? 360-e.webkitCompassHeading : e.alpha;
  const a=alpha*D,b=e.beta*D,g=e.gamma*D;
  const vx=-Math.cos(a)*Math.sin(g)-Math.sin(a)*Math.sin(b)*Math.cos(g);
  const vy=-Math.sin(a)*Math.sin(g)+Math.cos(a)*Math.sin(b)*Math.cos(g);
  const vz=-Math.cos(b)*Math.cos(g);
  const ny=(Math.atan2(vx,vy)/D+360)%360, k=1-SET.smooth; yaw=(yaw+(((ny-yaw+540)%360)-180)*k+360)%360;
  pitch+=(Math.max(-10,Math.min(88,Math.asin(Math.max(-1,Math.min(1,vz)))/D))-pitch)*k;
  needs=true;
}
async function startCompass(gesture){
  if(compassWanted) return;
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      if(!gesture) return;                       // iOS: ആദ്യ ടച്ചിൽ അനുമതി ചോദിക്കും
      if(await DeviceOrientationEvent.requestPermission()!=="granted") return;
    }
  }catch{return}
  window.addEventListener(orientEvt,handleOrientation); compassWanted=true;
}
function stopCompass(){
  window.removeEventListener(orientEvt,handleOrientation);
  compassWanted=false; compassOn=false; $("compassBtn").classList.remove("active");
}
$("compassBtn").onclick=()=>{ if(compassWanted) stopCompass(); else { startCompass(true); goFull(); } };

function parseCSV(t){
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){cur+='"';i++} else q=false } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===","){row.push(cur);cur=""}
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&t[i+1]==="\n")i++; row.push(cur);rows.push(row);row=[];cur=""; }
    else cur+=ch;
  }
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function loadArt(c){
  if(!c.artUrl){c.img=null;return}
  const im=new Image();
  im.onload=()=>{im._screen=opaqueCorner(im);c.img=im;needs=true}; im.src=c.artUrl;
}

    const all=parseCSV(await (await fetch(url+(url.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"})).text()), rows=all.slice(1);
    const map=new Map(rows.filter(r=>r[1]).map(r=>[r[1].trim().toUpperCase(),r]));
    cons.forEach(c=>{
      const r=map.get(c.abbr); if(!r) return;
      if(r[3]&&r[3].trim()) c.malayalam=r[3].trim();

      c.nak=(r[5]||"").trim(); c.stars=(r[6]||"").trim();
      const art=(r[7]||"").trim(); if(art&&art!==c.artUrl){c.artUrl=art;loadArt(c)}
      try{const an=(r[10]||"").trim(); if(an) c.anchors=JSON.parse(an)}catch{}
    });
    buildExtras(rows); normNames(); applyGloss(rows); window.SHEETSRC=(LIVE_CSV&&url===LIVE_CSV)?" • ലൈവ് ലിങ്ക്":" • പ്രസിദ്ധീകരിച്ച CSV"; setNotice(rows,all[0]); setEvents(rows); try{localStorage.setItem("nl_csv",url)}catch{}

}

    if(prev!==null){ if(prev>=-18&&al<-18&&a===null) a=t; if(prev<-18&&al>=-18&&a!==null&&b===null) b=t; } prev=al; }
  return [a,b];
}

// ===== patch15: ഗ്ലോസ്സറി — ഷീറ്റിൽ B="GLOSS" വരികൾ: C=English, D=ഇപ്പോഴത്തെ വാക്ക്, E=പുതിയ വാക്ക് =====
let GLOSS=[]; const _gc=new Map(), _go=new WeakMap();
const G=t=>{ if(!GLOSS.length||typeof t!=="string"||!t) return t; let r=_gc.get(t); if(r===undefined){ r=t; for(const [a,b] of GLOSS) if(r.includes(a)) r=r.split(a).join(b); _gc.set(t,r); } return r; };
function gNode(n){ const v=n.nodeValue, rec=_go.get(n), src=(rec&&rec.out===v)?rec.orig:v, r=G(src); _go.set(n,{orig:src,out:r}); if(r!==v) n.nodeValue=r; }
function gTree(root){ const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; while((n=w.nextNode())){ if(/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)) continue; gNode(n); } }
["fillText","strokeText","measureText"].forEach(k=>{ const f=CanvasRenderingContext2D.prototype[k]; CanvasRenderingContext2D.prototype[k]=function(t,...a){ return f.call(this,G(t),...a); }; });
new MutationObserver(ms=>{ if(!GLOSS.length) return; ms.forEach(m=>{ if(m.type==="characterData") gNode(m.target); else m.addedNodes.forEach(n=>{ if(n.nodeType===3) gNode(n); else if(n.nodeType===1) gTree(n); }); }); }).observe(document.body,{childList:true,subtree:true,characterData:true});
function sendGloss(){ const f=document.getElementById("infoFrame"); if(f&&f.contentWindow) f.contentWindow.postMessage({type:"aa-gloss",gloss:GLOSS},"*"); }
window.addEventListener("message",e=>{ if(e.data&&e.data.type==="aa-ready") sendGloss(); });
function setGloss(g){ GLOSS=g.sort((x,y)=>y[0].length-x[0].length); _gc.clear(); gTree(document.body); needs=true; sendGloss(); }
function applyGloss(rows){
  const g=rows.filter(r=>(r[1]||"").trim().toUpperCase()==="GLOSS"&&(r[3]||"").trim()&&(r[4]||"").trim()).map(r=>[r[3].trim(),r[4].trim()]);
  try{ localStorage.setItem("aa_gloss",JSON.stringify(g)); }catch{}
  setGloss(g);
}

  const L=EVENTS.map((e,i)=>[e,i]).filter(([e])=>e.d>=t0&&e.d-t0<=30*864e5);
  if(!L.length) return "";
  return `<h3 style="margin-top:10px">📅 വരാനിരിക്കുന്ന പരിപാടികൾ</h3>`+L.map(([e,i])=>`<div style="margin:4px 0"><b>${e.d.getDate()}/${e.d.getMonth()+1}</b> • ${escS(e.t)}${e.l?` <a style="color:var(--accent);text-decoration:underline" onclick="evOpen(${i})">കൂടുതൽ അറിയാൻ</a>`:""}</div>`).join("");
}
const _th=tonightHTML; tonightHTML=function(){ return _th()+eventsHTML(); };
let SHARE=null;
const _s5=showInfo; showInfo=function(c){ _s5(c); SHARE={t:c.label||c.malayalam,h:"c="+c.abbr}; };
const _b5=showBody; showBody=function(b){ _b5(b); SHARE={t:bodyLabel(b),h:"b="+b.key}; };
const _ag=applyGloss; applyGloss=function(rows){
  _ag(rows); GML=GLOSS.slice();
  GEN=rows.filter(r=>(r[1]||"").trim().toUpperCase()==="GLOSS"&&(r[3]||"").trim()&&(r[2]||"").trim()&&!(r[2]||"").startsWith("(")).map(r=>[r[3].trim(),r[2].trim()]);
  try{ localStorage.setItem("aa_gen",JSON.stringify(GEN)); }catch{}
  if(LANGEN) setGloss(GEN.slice());
};
try{ LANGEN=localStorage.getItem("aa_lang")==="en"; if(LANGEN){ GEN=JSON.parse(localStorage.getItem("aa_gen")||"[]"); GML=JSON.parse(localStorage.getItem("aa_gloss")||"[]"); if(GEN.length) setGloss(GEN.slice()); } }catch{}
(function(){
  const tb=$("toolbar"), mk=(id,ic,t,f)=>{ const b=document.createElement("button"); b.id=id; b.textContent=ic; b.title=t; b.onclick=f; tb.appendChild(b); };
  mk("shareBtn","🔗","പങ്കിടുക",()=>{
    const open=$("infoCard").classList.contains("show")&&SHARE, u=location.href.split("#")[0]+(open?"#"+SHARE.h:""), t=open?SHARE.t:"ആസ്ട്രോറിയം";
    if(navigator.share) navigator.share({title:t,text:t+" — ആസ്ട്രോറിയം",url:u}).catch(()=>{});
    else if(navigator.clipboard) navigator.clipboard.writeText(u).then(()=>toast("ലിങ്ക് കോപ്പി ചെയ്തു"));
    else prompt("ലിങ്ക്",u);
  });
  mk("langBtn","🌐","English / മലയാളം",()=>{
    if(!GEN.length){ toast("ഷീറ്റ് ലോഡ് ആയിട്ടില്ല"); return; }
    LANGEN=!LANGEN; try{ localStorage.setItem("aa_lang",LANGEN?"en":"ml"); }catch{}
    setGloss((LANGEN?GEN:GML).slice()); toast(LANGEN?"English":"മലയാളം");
  });
  const m=location.hash.match(/^#([cb])=([\w-]+)/);
  if(m) setTimeout(()=>{
    if(m[1]==="c"){ const c=cons.find(x=>x.abbr===m[2]); if(c){ c.checked=true; try{renderChecklist();}catch{} goTo(c.ra,c.dec,true); showInfo(c); } }
    else { const b=bodies.find(x=>x.key===m[2]); if(b){ goTo(b.ra,b.dec,false); showBody(b); } }
  },1800);
  if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();

// ===== patch16: ടൂൾബാറിൽ ആദ്യ 30 സെക്കൻഡ് പേരുകൾ =====
(function(){
  const st=document.createElement("style");
  st.textContent=".toolbar.lbl{width:auto;align-items:stretch}.toolbar{justify-content:flex-start}.toolbar.lbl{gap:4px}.toolbar.lbl button{width:auto;height:30px;padding:0 12px;font-size:13px;white-space:nowrap;text-align:left}.stx{margin-top:6px;white-space:normal}";
  document.head.appendChild(st);
  const tb=document.getElementById("toolbar"), orig=new Map();
  tb.querySelectorAll("button").forEach(b=>{ const t=b.textContent.trim(); if(b.title&&b.title!==t){ orig.set(b,b.textContent); b.textContent=t+" "+b.title; } });
  tb.classList.add("lbl");
  tb.scrollTop=0;
  setTimeout(()=>{ orig.forEach((t,b)=>{ b.textContent=t; }); tb.classList.remove("lbl"); tb.scrollTop=0; },Math.max(1000,30000-(Date.now()-APP_T0)));
})();

// ===== patch17: ഇന്നത്തെ പ്രത്യേകത — സ്ക്രോൾ അറിയിപ്പ് (ഷീറ്റ്: O=Notice, P=Notice_Link; ഏറ്റവും താഴത്തെ O വരി കാണിക്കും) =====
let tkClosed=false;
(function(){
  const st=document.createElement("style");
  st.textContent="#ticker{display:none;align-items:center;gap:6px;padding:3px 8px;font-size:12px;background:rgba(251,191,36,.16);border-bottom:1px solid var(--border);cursor:pointer}#ticker .tk-win{overflow:hidden;flex:1;white-space:nowrap}#tkIn{display:inline-block;padding-left:100%;animation:tkmove var(--tkd,20s) linear infinite}#tkIn a{color:var(--accent2,#fbbf24);text-decoration:underline;font-weight:700}#ticker .tk-win:active #tkIn{animation-play-state:paused}@keyframes tkmove{to{transform:translateX(-100%)}}#tkX{padding:0 6px;font-size:11px;flex:none}";
  document.head.appendChild(st);
  const ft=document.getElementById("footer"), tk=document.createElement("div"); tk.id="ticker";
  tk.innerHTML='<span>📢</span><div class="tk-win"><span id="tkIn"></span></div><button id="tkX">✕</button>';
  ft.insertBefore(tk,ft.firstChild);
  document.getElementById("tkX").onclick=e=>{ e.stopPropagation(); tkClosed=true; tk.style.display="none"; setFH(); };
  tk.onclick=()=>{ if(tk.dataset.link) openStory({story:tk.dataset.link,title:"ഇന്നത്തെ പ്രത്യേകത"}); };
})();
function setNotice(rows,hdr){
  const tk=document.getElementById("ticker"); if(!tk) return;
  const hn=(hdr||[]).map(h=>(h||"").toLowerCase().replace(/[\s_\-]/g,"")); let ni=hn.findIndex(h=>["notice","scroll","ticker","todayspecial","announcement"].includes(h)); if(ni<0) ni=14; const li=ni+1;
  let r=null; for(let i=rows.length-1;i>=0;i--){ if((rows[i][ni]||"").trim()){ r=rows[i]; break; } }
  if(location.hash==="#debug") alert("ഷീറ്റ് വരികൾ: "+rows.length+"\nതലക്കെട്ടുകൾ: "+(hdr||[]).join(", ")+"\nNotice കോളം: "+String.fromCharCode(65+ni)+"\nകണ്ടത്: "+(r?r[ni].slice(0,60):"ഒന്നുമില്ല"));
  window.SHEETINFO="ഷീറ്റ്: "+rows.length+" വരികൾ • അറിയിപ്പ്: "+(r?"ഉണ്ട്":"ഇല്ല")+" • കോളം "+String.fromCharCode(65+ni)+(window.SHEETSRC||"");
  if(!r||tkClosed){ tk.style.display="none"; setFH(); return; }
  const tx=r[ni].trim().replace(/\s+/g," "), ln=(r[li]||"").trim(), inn=document.getElementById("tkIn");
  inn.textContent=tx+(ln?"   ➜   ":""); tk.dataset.link=ln;
  if(ln){ const a=document.createElement("a"); a.textContent="കൂടുതൽ അറിയാൻ ഇവിടെ ക്ലിക്ക് ചെയ്യുക"; inn.appendChild(a); }
  inn.style.setProperty("--tkd",Math.max(12,Math.round((tx.length+40)*0.22))+"s");
  tk.style.display="flex"; setFH();
}

setInterval(()=>{ const h=document.getElementById("helpInfo"); if(h) h.textContent=window.SHEETINFO||"ഷീറ്റ്: ലോഡ് ചെയ്യുന്നു..."; },1000);
window.addEventListener("message",e=>{
  const d=e.data, f=document.querySelector("#storyBody iframe");
  if(!d||d.type!=="aa-goto"||!f||e.source!==f.contentWindow) return;
  $("storyClose").click();
  if(d.kind==="c"){ const c=cons.find(x=>x.abbr===d.key); if(c){ c.checked=true; try{renderChecklist();}catch{} goTo(c.ra,c.dec,true); showInfo(c); } }
  else if(d.kind==="b"){ const b=bodies.find(x=>x.key===d.key); if(b){ goTo(b.ra,b.dec,false); showBody(b); } }
  else if(d.kind==="n"){ const n=NAK[+d.key-1]; if(n){ goTo(n[2],n[3],true); showNakInfo(n); } }
});
// ===== പേരിന് അടുത്തുള്ള ബ്ലോക്ക്: സമയം ⚙ | 🧭 | 🔭 | 🔍 =====
function clockText(){ const d=new Date(Date.now()); return `${d.getDate()}/${d.getMonth()+1} ${fmt(d.getTime())}`; }
function tickClock(){
  $("clkT").textContent=(TOFF?"⏱ ":"")+clockText();
  $("clk").classList.toggle("shift",!!TOFF);
  $("clk").title=TOFF?"സമയം മാറ്റിയിരിക്കുന്നു: ഇപ്പോഴത്തെ സമയത്തിലേക്ക് മടങ്ങാൻ അമർത്തുക":"ഇപ്പോഴത്തെ സമയം";
  $("qComp").classList.toggle("active",$("compassBtn").classList.contains("active"));
  $("qSrch").classList.toggle("active",$("searchBtn").classList.contains("active"));
  $("qTon").classList.toggle("active",$("tonightBtn").classList.contains("active"));
  setFH();
}
$("clk").onclick=e=>{ if(e.target.id==="clkGear") return; if(TOFF){ TOFF=0; needs=true; tickClock(); toast("ഇപ്പോഴത്തെ സമയം"); } };
$("clkGear").onclick=e=>{ e.stopPropagation(); $("timeBtn").click(); };
$("qComp").onclick=()=>{ $("compassBtn").click(); setTimeout(()=>{ tickClock(); toast("കോമ്പസ് : "+($("compassBtn").classList.contains("active")?"ഓൺ":"ഓഫ്")); },80); };
$("qTon").onclick=()=>{ $("tonightBtn").click(); setTimeout(tickClock,40); };
$("qSrch").onclick=()=>{ $("searchBtn").click(); setTimeout(tickClock,40); };
setInterval(tickClock,1000); tickClock();
</script>
