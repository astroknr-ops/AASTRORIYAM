<!DOCTYPE html>
<html lang="ml"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AASTRORIYAM art.json Builder</title>
<style>body{font-family:system-ui,"Noto Sans Malayalam",sans-serif;max-width:560px;margin:24px auto;padding:0 16px;line-height:1.6;background:#0b1224;color:#f1f5f9}
button,input{font-size:15px;margin:8px 0}button{padding:10px 16px;border-radius:8px;border:0;background:#38bdf8;color:#04121f;font-weight:700}.bad{color:#fca5a5}.ok{color:#86efac}code{color:#fde68a}</style></head><body>
<h2>art.json ബിൽഡർ</h2>
<p>Stellarium-ന്റെ <code>index.json</code> (modern sky culture) തിരഞ്ഞെടുക്കുക. ഇന്റർനെറ്റ് വേണം: നക്ഷത്ര കോർഡിനേറ്റുകൾ d3-celestial-ൽ നിന്ന് എടുക്കും.</p>
<input type="file" id="f" accept=".json"><br><button id="go">art.json ഉണ്ടാക്കുക</button><div id="log"></div>
<script>
const BASE="https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/";
async function hipMap(files,need){
  const m=new Map();
  for(const n of files){
    if([...need].every(h=>m.has(h))) break;
    try{ const j=await (await fetch(BASE+n)).json();
      for(const f of j.features){ const h=Number(f.id); if(need.has(h)&&!m.has(h)){ const [lo,la]=f.geometry.coordinates; m.set(h,[((lo+360)%360)/15,la]); } }
    }catch(e){}
  }
  return m;
}
function build(idx,m){
  const out={},miss=[],files=[];
  for(const c of idx.constellations||[]){
    const im=c.image; if(!im||!im.anchors||im.anchors.length<3) continue;
    const abbr=String(c.id).split(" ").pop().toUpperCase();
    const an=im.anchors.slice(0,3).map(a=>{const p=m.get(Number(a.hip)); return p?[+(a.pos[0]/im.size[0]).toFixed(4),+(a.pos[1]/im.size[1]).toFixed(4),+p[0].toFixed(4),+p[1].toFixed(3)]:null});
    if(an.some(x=>!x)){miss.push(abbr);continue}
    const file=im.file.split("/").pop();
    out[abbr]={file,anchors:an}; files.push(file);
  }
  return {out,miss,files};
}
document.getElementById('go').onclick=async()=>{
  const log=document.getElementById('log'),f=document.getElementById('f').files[0];
  if(!f){log.innerHTML='<p class="bad">ആദ്യം index.json തിരഞ്ഞെടുക്കുക.</p>';return}
  let idx; try{idx=JSON.parse(await f.text())}catch(e){log.innerHTML='<p class="bad">JSON വായിക്കാൻ പറ്റിയില്ല.</p>';return}
  log.textContent='നക്ഷത്ര ഡാറ്റ എടുക്കുന്നു...';
  const need=new Set(); (idx.constellations||[]).forEach(c=>c.image&&c.image.anchors&&c.image.anchors.forEach(a=>need.add(Number(a.hip))));
  const m=await hipMap(["stars.6.json","stars.8.json"],need);
  const {out,miss,files}=build(idx,m), n=Object.keys(out).length;
  if(!n){log.innerHTML='<p class="bad">ഒരു ചിത്രവും കിട്ടിയില്ല (ഇന്റർനെറ്റ് / ഫയൽ പരിശോധിക്കുക).</p>';return}
  const url=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
  log.innerHTML='<p class="ok">'+n+' ചിത്രങ്ങൾ തയ്യാർ.'+(miss.length?' നക്ഷത്രം കിട്ടാത്തത്: '+miss.join(', '):'')+'</p><a href="'+url+'" download="art.json"><button>art.json ഡൗൺലോഡ്</button></a><p>ഈ '+n+' PNG ഫയലുകൾ റിപ്പോയിലെ <code>art</code> ഫോൾഡറിൽ വേണം: <code>'+files.slice(0,6).join(', ')+' ...</code></p>';
};
</script></body></html>
